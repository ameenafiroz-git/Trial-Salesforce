name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Test pipeline
        run: echo "CI is working"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Verify Node and npm
        run: |
          node -v
          npm -v

      - name: Install Salesforce CLI
        run: |
          npx @salesforce/cli --version
          echo "Salesforce CLI installed"

      - name: Authenticate to Dev2 org
        run: echo "${{ secrets.DEV2_AUTH_URL }}"  > auth.txt npx @salesforce/cli org login sfdx-url -f auth.txt -a dev2

      - name: Deploy to Dev2
        run: npx @salesforce/cli sf project deploy start --manifest manifest/package.xml --target-org dev2 \--wait 10
