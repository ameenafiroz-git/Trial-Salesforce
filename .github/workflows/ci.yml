name: PR Validation

on:
  pull_request:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Test pipeline
        run: echo "CI is working"

      - name: Install Salesforce CLI
        run: npn install -g @salesforce/CLI

      - name: Authenticate to Dev2 org
        run: echo "${{ secrets.DEV2_AUTH_URL }}"  > auth.sf org login sfdx-url -f auth.txt -a dev2

      - name: Deploy to Dev2
        run: sf project deploy start \ --manifest/package.xml \ --target-org dev2 \--wait 10
