name: PR Validation

on:
  pull_request:
    branches:
      - dev2
      - release/*

  push:
    branches:
      - dev2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    container:
      image: salesforce/salesforcedx:latest-full
      options: --user root

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git safe directory (Docker)
        run: |
          git config --global --add safe.directory $GITHUB_WORKSPACE
          git config --global --add safe.directory /__w
          git config --global --add safe.directory '*'

      - name: Verify Salesforce CLI
        run: sf --version

      - name: Install SGD plugin (compatible version)
         run: |
         echo Y | sf plugins install sfdx-git-delta@5.0.5

      - name: Check plugins
        run: sf plugins

      - name: Create JWT key file
        run: printf "%s" "${{ secrets.JWT_KEY }}" > server.key

      - name: Authenticate to Salesforce (JWT)
        run: |
          sf org login jwt \
            --client-id ${{ secrets.CLIENT_ID }} \
            --jwt-key-file server.key \
            --username "${{ secrets.USERNAME }}" \
            --instance-url https://test.salesforce.com \
            --alias dev2 \
            --set-default

      - name: Verify login
        run: sf org display --target-org dev2

      - name: Fetch base branch
        run: git fetch origin dev2

      - name: Generate delta
        run: |
          mkdir -p delta

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            sf sgd source delta \
              --to HEAD \
              --from origin/dev2 \
              --output delta
          else
            sf sgd source delta \
              --to HEAD \
              --from HEAD~1 \
              --output delta
          fi

      - name: Show delta
        run: ls -R delta || echo "No delta found"

      - name: Check destructive changes
        id: check_destructive
        run: |
          if [ -f delta/destructiveChanges/destructiveChanges.xml ] && grep -q "<members>" delta/destructiveChanges/destructiveChanges.xml; then
            echo "destructive=true" >> $GITHUB_OUTPUT
          else
            echo "destructive=false" >> $GITHUB_OUTPUT
          fi

      - name: Check delta
        id: check_delta
        run: |
          if [ -z "$(find delta -type f -name '*.xml')" ]; then
            echo "empty=true" >> $GITHUB_OUTPUT
          else
            echo "empty=false" >> $GITHUB_OUTPUT
          fi

      - name: Validate (PR only)
        if: github.event_name == 'pull_request' && steps.check_delta.outputs.empty == 'false'
        run: |
          sf project deploy start \
            --source-dir delta \
            --target-org dev2 \
            --dry-run \
            --test-level NoTestRun \
            --wait 10

      - name: Validate destructive (PR only)
        if: github.event_name == 'pull_request' && steps.check_destructive.outputs.destructive == 'true'
        run: |
          cat <<EOF > delta/destructive-package.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <Package xmlns="http://soap.sforce.com/2006/04/metadata">
              <version>61.0</version>
          </Package>
          EOF

          sf project deploy start \
            --manifest delta/destructive-package.xml \
            --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
            --target-org dev2 \
            --dry-run \
            --test-level NoTestRun \
            --wait 10

      - name: Deploy to Dev2 (on merge)
        if: github.event_name == 'push' && steps.check_delta.outputs.empty == 'false'
        run: |
          sf project deploy start \
            --source-dir delta \
            --target-org dev2 \
            --test-level NoTestRun \
            --wait 10

      - name: Deploy destructive (on merge)
        if: github.event_name == 'push' && steps.check_destructive.outputs.destructive == 'true'
        run: |
          cat <<EOF > delta/destructive-package.xml
          <?xml version="1.0" encoding="UTF-8"?>
          <Package xmlns="http://soap.sforce.com/2006/04/metadata">
              <version>61.0</version>
          </Package>
          EOF

          sf project deploy start \
            --manifest delta/destructive-package.xml \
            --post-destructive-changes delta/destructiveChanges/destructiveChanges.xml \
            --target-org dev2 \
            --test-level NoTestRun \
            --wait 10
