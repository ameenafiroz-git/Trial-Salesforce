name: PR Validation

on:
  pull_request:
    branches:
      - dev2
      - feature/dummy-ci

  push:
    branches:
      - dev2

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test pipeline
        run: echo "CI is working"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Verify Node and npm
        run: |
          node -v
          npm -v

      - name: Install Salesforce CLI+SGD
        run: |
          npm install -g @salesforce/cli
          echo "Salesforce CLI is installed"
          echo Y | sf plugins install sfdx-git-delta

      - name: Check plugins
        run: sf plugins

      - name: Verify org login
        run: npx @salesforce/cli org list

      - name: Debug secrets
        run: |
          echo "Key exists?"
          echo "${{ secrets.JWT_KEY }}" | wc -c

      - name: Authenticate to Dev2 org
        run: |
          echo "Start"
          echo "${{ secrets.JWT_KEY }}" > server.key
          echo "Before sfdx"
          sfdx auth:jwt:grant --client-id ${{ secrets.CLIENT_ID }} --jwt-key-file server.key --username ${{ secrets.USERNAME }} --instance-url https://test.salesforce.com --set-default-username --alias dev2
          echo "after sfdx"

      - name: Verify org dev2 login
        run: sf org display --target-org dev2

      - name: Debug files
        run: ls -la

      - name: Debug metadata
        run: find force-app -type f

      - name: Generate delta
        run: |
          mkdir -p delta

          sf sgd:source:delta \
          --to HEAD \
          --from origin/dev2 \
          --output-dir delta \
          --generate-delta

      - name: Check delta // to avoid pipeline fails on empty delta
        id: check_delta
        run: |
          if [ ! -d "delta " ] || [-z "$(ls -A delta)" ]; then
            echo "No changes to deploy. Skipping...."
            exit 0
          fi

      - name: Validate (PR only)
        if: github.event_name == 'pull_request' && steps.check_delta.outputs.empty =='false'
        run: |
          sf project deploy start \
            --source-dir delta \
            --target-org dev2 \
            --dry-run \
            --test-level RunLocalTests \
            --wait 10

      - name: Deploy to Dev2 (on merge)
        if: github.event_name == 'push' && steps.check_delta.outputs.empty =='false'
        run: sf project deploy start \
          --source-dir delta \
          --target-org dev2 \
          --test-level RunLocalTests
          --wait 10
